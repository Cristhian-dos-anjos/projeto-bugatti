<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- As metas tags SEMPRE dentro do head -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bugatti | Create the Incomparable</title>
    
    <!-- Ícone da aba -->
    <link rel="icon" type="image/png" size="24x24" href="/img/logo bugatti.png">

    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/js/index.js">
</head>
<body>
    
    <nav id="mainNav">
        <div class="logo"><img src="/img/bugatti-brand-logo-white-vector-45972537-Photoroom (1).png" alt="BUGATTI" class="Logo-img">BUGATTI</div>
        <div class="menu">
            <a href="/html/modelos.html">Modelos</a>
            <a href="/html/lifestyle.html">Lifestyle</a>
            <a href="#specs">Performance</a>
        </div>
    </nav>
    
    <video autoplay muted loop playsinline class="video-bg">
        <source src="/Video/Bugatti-Chiron-Edit-2-4K.mp4" type="video/mp4">
    </video>
    
    <section class="hero">
        <p>A quintessência da performance</p>
        <img src="/img/logo chiron.png" alt="assinatura bugatti chiron">
        <a href="/html/testemunhe a lenda.html" style="text-decoration: none;">
            <button class="cta-button">Testemunhe a lenda</button>
        </a>
    </section>
    
    <section class="specs" id="specs">
        
        <div class="spec-item">
            <h2><span class="counter" data-target="1500">0</span></h2>
            <p>Potência Máxima (HP)</p>
        </div>
        
        <div class="spec-item">
            <h2><span class="counter" data-target="420">0</span></h2>
            <p>Velocidade Final (KM/H)</p>
        </div>
        
        <div class="spec-item">
            <h2><span class="counter" data-target="2.4" data-decimals="1">0</span></h2>
            <p>0-100 KM/H (S)</p>
        </div>
        
    </section>
<script src="/js/index.js"></script>
</body>
</html>
